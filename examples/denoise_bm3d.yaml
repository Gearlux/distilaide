# Apply BM3D classical denoising to a numpy array.
#
# Generate a noisy test image first, then run distilaide:
#
#   python -c "import numpy as np; \
#              rng = np.random.default_rng(0); \
#              img = np.clip(rng.normal(0.5, 0.1, (128, 128)), 0, 1).astype('float32'); \
#              np.save('examples/data/noisy.npy', img)"
#   distilaide denoise examples/denoise_bm3d.yaml

denoiser: !class:distilaide.Denoiser
  method: bm3d
  sigma: 0.10

input: examples/data/noisy.npy
output: examples/data/clean_bm3d.npy

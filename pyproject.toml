[project]
name = "distilaide"
version = "0.1.0"
description = "(logflow / confluid / liquifai) adapter over deepinv, asteroid, BM3D, and noisereduce for AI and classical denoising."
authors = [{name = "Taidal"}]
license = {text = "MIT"}
dependencies = [
    "liquifai>=0.1.0",
    "log-flow>=0.1.0",
    "confluid>=0.1.0",
    "numpy>=1.26",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=6.0.0,<8.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
]
deepinv = [
    "deepinv>=0.2.0",
    "torch>=2.1",
]
asteroid = [
    "asteroid>=0.7.0",
    "torch>=2.1",
    "torchaudio>=2.1",
]
classical = [
    "bm3d>=4.0.0",
    "noisereduce>=3.0.0",
    "scipy>=1.11",
]
all = [
    "distilaide[deepinv,asteroid,classical]",
]

[project.scripts]
distilaide = "distilaide.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["distilaide*"]

[tool.setuptools.package-data]
distilaide = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["distilaide"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203"]

[tool.mypy]
disable_error_code = ["import-untyped"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchaudio.*",
    "deepinv.*",
    "asteroid.*",
    "bm3d.*",
    "noisereduce.*",
    "scipy.*",
    "liquifai.*",
    "confluid.*",
    "logflow.*",
]
ignore_missing_imports = true

[build-system]
# >=77 for the PEP 639 `license` string + `license-files` below.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distilaide"
version = "0.1.0a1"
description = "Image restoration across training backends, driven by one config (deepinv models)."
readme = "README.md"
authors = [{name = "Gert Behiels"}]
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
# The CORE is backend-free: `pip install distilaide` gives the CLI and the config surface only, so
# a machine that has not chosen a training framework never installs one. Every ML framework lives
# in the extra of the backend that needs it (see `[project.optional-dependencies]`), and every
# backend-owned name in `distilaide/__init__.py` resolves lazily to match.
# Floors are what the suite runs against in a clean venv resolving from PyPI alone, and each release
# raises every workspace floor to the newest release (user choice 2026-11-26). Measured 2026-11-26 at
# confluid 0.5.0, liquifai 0.4.0, loggair 0.3.0, recordstream 0.1.0a4 and matrainer 0.1.0a3:
# the suite passed (256, 6 skipped).
dependencies = [
    # recordstream and matrainer ship as pre-releases: under PEP 440 a plain `>=0.1.0` EXCLUDES
    # every pre-release of 0.1.0.
    "confluid>=0.5.0",
    "recordstream>=0.1.0a4",
    "liquifai>=0.4.0",
    "loggair>=0.3.0",
    # matrainer is the TRACKING library (and the metric-slot rule + artifact writers). Its own
    # core install is light — no torch — so it belongs here rather than in a backend extra.
    "matrainer>=0.1.0a3",
]
requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/Gearlux/distilaide"
Repository = "https://github.com/Gearlux/distilaide.git"
Issues = "https://github.com/Gearlux/distilaide/issues"
Changelog = "https://github.com/Gearlux/distilaide/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# One extra per training backend. `aisland workspace configure framework set torch lightning` installs the
# ones the workspace has chosen, in every project that offers them (see [tool.aisland.selection.framework] below).
#
# `torch` is the BASE of the three torch-backed backends: it carries the model zoo, the losses,
# the metrics and the preprocessing that `lightning` and `fastai` also need, so each of those
# declares `distilaide[torch]` rather than restating the list. That is not just economy — it is
# what makes "the config does not change between backends" true of the INSTALL as well.
torch = [
    "matrainer[torch]>=0.1.0a3",
    "recordstream[torch]>=0.1.0a4",
    "torch",
    "torchvision",
    # The image-quality metrics a restoration run is scored on (`PeakSignalNoiseRatio` /
    # `StructuralSimilarityIndexMeasure` — see `distilaide/torch_restoration.py`).
    "torchmetrics",
    # `deepinv.models` — the restoration zoo `DeepInvModel` wraps: the learned denoisers
    # (DnCNN / DRUNet / SCUNet / SwinIR / Restormer / FFDNet / UNet) AND the classical baselines
    # (TV / wavelet / median / bilateral), all of them `torch.nn.Module`s.
    "deepinv>=0.4",
    # The degradation the example config applies (`albumentations.GaussNoise`) and the resize
    # every image pipeline needs.
    "albumentations>=2.0",
]
lightning = [
    "distilaide[torch]",
    "matrainer[lightning]>=0.1.0a3",
    "pytorch-lightning",
]
# TWO upper bounds, both upstream breaks and both removable when upstream fixes them — do NOT
# delete them as "hardcoded versions". `fastcore<2`: fastai's own `Optimizer.set_hypers` still
# calls `L.starmap`, which fastcore 2.x removed, so `fit_one_cycle` dies at the first
# `create_opt()`; fastai declares only `fastcore>=1.8.0`, so a fresh resolve picks 2.x and EVERY
# fastai run fails. `fastprogress<1.1`: 1.1 added a `python-fasthtml` dependency — a progress bar
# pulling in a web framework — which drags `starlette` past what other workspace packages pin.
fastai = [
    "distilaide[torch]",
    "fastai>=2.7",
    "fastcore<2",
    "fastprogress<1.1",
]
# BM3D is an OPTIONAL sub-extra of the zoo rather than part of `[torch]`: `deepinv.models.BM3D`
# imports the `bm3d` package lazily, so every other architecture works without it, and the wheel
# is a heavy native build that a run wiring `arch: dncnn` never touches. It is the one classical
# baseline with a dependency the others do not have (TV / wavelet / median / bilateral are pure
# torch or ride deepinv's own `[denoisers]` stack).
bm3d = [
    "distilaide[torch]",
    "bm3d>=4.0.0",
]
# Keras 3 is an API, not an engine — it needs ONE compute backend underneath (torch / TF / jax),
# and `recordstream.keras` (which `distilaide/_keras.py` imports through) selects whichever is
# installed. So each Keras-family extra names its OWN engine; a `tensorflow = ["distilaide[keras]",
# …]` chain would drag torch into a TensorFlow install, the opposite of what selecting an extra is
# for. Neither names `distilaide[torch]`: the deepinv zoo and torchmetrics belong to the torch
# backends, and a Keras config wires `KerasDnCNN` + `keras.losses` instead.
keras = [
    "keras>=3.0",
    "torch",                # the engine `distilaide[keras]` runs Keras on
    # The PyDataset batching adapter (`recordstream.keras.RecordSequence`) + the KERAS_BACKEND
    # import ordering this backend depends on.
    "recordstream[keras]>=0.1.0a4",
    # Tracking for a Keras run. matrainer[keras], NOT matrainer[tensorflow]: the callback needs
    # the Keras API, not the TensorFlow engine.
    "matrainer[keras]>=0.1.0a3",
    "albumentations>=2.0",
]
tensorflow = [
    "keras>=3.0",           # Keras 3 IS tf.keras in TF >= 2.16
    "tensorflow>=2.16",     # ...this extra's engine
    "recordstream[keras]>=0.1.0a4",
    "matrainer[keras]>=0.1.0a3",
    "albumentations>=2.0",
]
# JAX and MLX bring NO zoo to wrap — deepinv is torch-only and nothing publishes JAX or MLX
# denoising weights — so each of these installs only its framework and trains `distilaide/dncnn/`'s
# shared spec. Neither names `distilaide[torch]`: their losses are their own framework's plain
# functions, and the metrics come from matrainer's framework-free accumulator.
jax = [
    "jax>=0.4",
    "flax>=0.8",            # NNX is the current Flax module API
    "optax>=0.2",           # the optimizers and losses; JAX itself ships neither
    # The PyDataset batching adapter (`recordstream.keras.RecordSequence`), reused verbatim —
    # batching a record stream is not a JAX problem.
    "recordstream[keras]>=0.1.0a4",
    "matrainer>=0.1.0a3",
    "albumentations>=2.0",
]
mlx = [
    # Apple silicon only — the marker keeps `pip install distilaide[mlx]` from failing outright
    # elsewhere, so the extra stays installable (and empty) on any machine.
    "mlx>=0.15; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "recordstream[keras]>=0.1.0a4",
    "matrainer>=0.1.0a3",
    "albumentations>=2.0",
]
# `transformers` runs its models on torch here, so this extra names torch's stack — but NOT
# `distilaide[torch]`: a Swin2SR run has no use for the deepinv zoo. Its metrics come from
# matrainer's framework-free accumulator, because `Trainer`'s `compute_metrics` hook receives
# numpy arrays rather than tensors.
huggingface = [
    "transformers>=4.40",
    "accelerate>=0.30",     # what `Trainer` uses for device/distribution placement
    "torch",
    "recordstream[torch]>=0.1.0a4",
    "matrainer[torch]>=0.1.0a3",
    "albumentations>=2.0",
]
# TRACKING BACKENDS. Tracking runs through matrainer — distilaide imports neither mlflow nor
# tensorboard directly — so each extra forwards to the backend that implements it. They must
# exist because `[tool.aisland.selection.tracker]` below NAMES them: choosing `mlflow` intersects that menu
# with the operator's choice and installs `distilaide[mlflow]`,
# and an extra that is declared but never defined makes uv warn and install nothing.
mlflow = ["matrainer[mlflow]>=0.1.0a3"]
tensorboard = ["matrainer[tensorboard]>=0.1.0a3"]
dev = [
    # Release tooling: `python -m build` produces the sdist + wheel, `twine check`
    # validates the metadata PyPI will re-validate on upload.
    "build>=1.0.0",
    "twine>=5.0.0",
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=6.0.0,<8.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
]

# Which training backends this project OFFERS. `aisland workspace configure framework` lists it; what actually
# installs is the workspace-wide choice committed in `workspace.toml`, so a machine that has
# not selected `lightning` builds distilaide without torch.
[tool.aisland.selection.framework]
choices = ["torch", "lightning", "fastai", "keras", "tensorflow", "jax", "mlx", "huggingface"]

[tool.aisland.selection.tracker]
choices = ["mlflow", "tensorboard"]

[project.scripts]
distilaide = "distilaide.cli:main"

# Liquifai app registration: lets `liquifai-install-completions` discover this
# CLI via an instant entry-point metadata read instead of executing the binary
# (subprocess probe, 15 s timeout each). Name = the app/binary name; value =
# the LiquifyApp instance. Entry-point changes need an editable reinstall.
[project.entry-points."liquifai.apps"]
distilaide = "distilaide.cli:app"

# ONE entry point per REGISTERING module — never the package. `import distilaide` registers
# nothing (every backend-owned name is lazy, so a machine without torch never imports it), so
# discovery runs entirely off this table: a scanner imports each module named here, and the import
# is what executes the `@configurable` decorators. A module missing from this list registers
# NOTHING, and the failure is silent in every way a developer would notice — a dotted path in YAML
# still imports the module itself, and the CLI imports its own backend, so only navigaitor's
# pickers, the form-specs and the StreamStudio palette go blind, by offering FEWER options.
#
# Naming: `distilaide-<backend>` for a runnable, `distilaide-<backend>-model` for a zoo wrapper,
# `distilaide-<framework>-restoration` for a loss/metric set. After changing this table, reinstall
# the editable (`uv pip install -e ./distilaide --no-deps`) for the metadata to take effect.
# `tests/test_entry_points.py` DERIVES the expectation from the tree, in both directions.
[project.entry-points."confluid.configurables"]
distilaide-lightning = "distilaide.lightning_restorer"
distilaide-torch = "distilaide.torch_restorer"
distilaide-fastai = "distilaide.fastai_restorer"
distilaide-keras = "distilaide.keras_restorer"
distilaide-tensorflow = "distilaide.tensorflow_restorer"
# The jax and mlx runnables register NO losses — optax and mlx.nn ship plain FUNCTIONS, so those
# are resolved by NAME and there is nothing for the registry to tag.
distilaide-jax = "distilaide.jax_restorer"
distilaide-mlx = "distilaide.mlx_restorer"
distilaide-huggingface = "distilaide.huggingface_restorer"
distilaide-huggingface-model = "distilaide.huggingface_model"
distilaide-deepinv-model = "distilaide.deepinv_model"
distilaide-iq-denoiser = "distilaide.iq_denoiser"
distilaide-torch-restoration = "distilaide.torch_restoration"
distilaide-keras-restoration = "distilaide.keras_restoration"
# The shared DnCNN spec's implementations — one entry point each, like every other registering
# module. `spec.py` itself registers nothing (it exports constants and a function), so it has none.
distilaide-torch-dncnn = "distilaide.dncnn.torch_dncnn"
distilaide-keras-dncnn = "distilaide.dncnn.keras_dncnn"
distilaide-tensorflow-dncnn = "distilaide.dncnn.tensorflow_dncnn"
distilaide-flax-dncnn = "distilaide.dncnn.flax_dncnn"
distilaide-mlx-dncnn = "distilaide.dncnn.mlx_dncnn"

[tool.setuptools.packages.find]
where = ["."]
include = ["distilaide*"]

[tool.setuptools.package-data]
distilaide = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["distilaide"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203"]

[tool.mypy]
disable_error_code = ["import-untyped"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true
explicit_package_bases = true

# Optional-extra libraries CI does not install. CI runs `mypy .` HERE with only the extras its
# install line names, so every module an extra-gated backend imports must be listed, or CI
# fails on `import-not-found` while the workspace-root run (everything installed) passes —
# measured 2026-09-28 before the first release. `mlx` cannot be installed on Linux at all.
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchvision.*",
    "torchmetrics.*",
    "pytorch_lightning.*",
    "deepinv.*",
    "albumentations.*",
    "fastai.*",
    "fastcore.*",
    "jax.*",
    "flax.*",
    "optax.*",
    "mlx.*",
]
ignore_missing_imports = true

# Apply noisereduce spectral-gating to a 16 kHz mono WAV file.
#
# Requires the [classical] extra (pulls scipy + noisereduce):
#   pip install -e ".[classical]"

denoiser: !class:distilaide.Denoiser
  method: noisereduce
  sample_rate: 16000
  stationary: true
  prop_decrease: 0.9

input: examples/data/noisy.wav
output: examples/data/clean.wav

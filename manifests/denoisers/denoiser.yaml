description: "Confluid-configurable dispatcher over four denoising backends — deepinv / asteroid / bm3d / noisereduce."
use_case: "Single class wraps 12 methods across the four backends. Pick a method by name (e.g. method='bm3d', method='dncnn', method='convtasnet'). The dispatcher lazy-imports the backend on first call so the heavy DL deps are pay-as-you-use."
category: "Denoising"
flux_type: "Denoiser"
task: "signal_denoising"
class_path: "distilaide.api.Denoiser"
params:
  method:
    type: "str"
    required: true
    description: "Method name from any installed backend. Run `distilaide list-methods` (or list_methods()) to enumerate available methods given the current install."
  sigma:
    type: "float | null"
    default: null
    description: "Common scale parameter forwarded to backends that need a noise-level estimate (bm3d / dncnn / drunet)."
  backend_kwargs:
    type: "Dict[str, Any]"
    default: {}
    description: "Method-specific kwargs forwarded verbatim to the backend's denoise function."
